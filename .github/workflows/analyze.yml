name: Analyze Kotlin Source
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/MainActivity.kt'
      - 'modularization/**'
      - '.github/workflows/analyze.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze source without modifying it
        run: python modularization/scripts/analyze_source.py --source source/MainActivity.kt --out modularization/reports
      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: mris-media-source-analysis
          path: modularization/reports/
          
